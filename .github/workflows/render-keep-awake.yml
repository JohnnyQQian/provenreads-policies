name: Keep Render awake

on:
  schedule:
    - cron: '1,13,24,37,49 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            https://provenreads-api.onrender.com/health/live
